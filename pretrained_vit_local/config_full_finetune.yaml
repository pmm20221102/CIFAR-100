experiment_name: deit_tiny_full_finetune

device:
  amp: true
  compile: false

data:
  dataset_root: D:\Study\cifar100
  image_size: 224
  train_batch_size: 64
  test_batch_size: 128
  num_workers: 4

model:
  library: timm
  name: deit_tiny_patch16_224
  pretrained: true
  num_classes: 100
  mode: full_finetune

train:
  epochs: 50
  optimizer: adamw
  backbone_lr: 0.00002
  head_lr: 0.0001
  weight_decay: 0.05
  warmup_epochs: 5
  label_smoothing: 0.1
  gradient_clip_norm: 1.0
  gradient_accumulation_steps: 2
  early_stop_patience: 15
  early_stop_min_delta: 0.001
  seed: 42

output:
  model_dir: models/pretrained_vit_full
  log_dir: logs/pretrained_vit_full
  result_dir: results/pretrained_vit_full
  save_every_epochs: 10
